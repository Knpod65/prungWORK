<style>
:root{
  --background:#1A2E24; --foreground:#FFFFFF; --card:#FFFFFF; --card-fg:#1A1A1A;
  --primary:#2563EB; --primary-hover:#1D4ED8; --primary-active:#1E40AF;
  --secondary:#3A4F44; --muted:#2A3D32; --muted-fg:#C8D4CC; --accent:#7CB87A; --accent-fg:#0F1A14;
  --destructive:#B84A3A; --border:#5A6B60; --input:#6A7B70; --soft:#F3F4F6; --line:#E5E7EB; --ink2:#5B6770;
  --scrim:rgba(26,46,36,.82); --err-soft:#F2B8AE; --disabled-dark:#9FB0A6; --placeholder:#6B7780; --ink3:#374151; --destructive-hover:#9C3C2E;
  --font:Inter,'Noto Sans Thai',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;accent-color:var(--primary);
}
::selection{background:var(--accent);color:var(--accent-fg)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--background);color:var(--foreground);font:400 16px/1.5 var(--font);min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;overflow-x:hidden}
.scenic{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.nav,main,.proof{position:relative;z-index:1}
.nav{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 32px}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px}
.leaf{width:22px;height:22px;background:var(--accent);border-radius:2px 14px 2px 14px;display:inline-block}
.who{display:flex;align-items:center;gap:12px;font-size:14px;color:var(--muted-fg)}
main{flex:1;width:100%;max-width:980px;margin:0 auto;padding:16px 24px 32px}
.proof{text-align:center;padding:16px 24px 24px;font-size:13px;font-weight:600;color:var(--muted-fg)}

/* hero */
.hero{text-align:center;padding:32px 0 16px}
h1{font-size:clamp(32px,6vw,56px);line-height:1.3;font-weight:700;margin:0 0 16px;text-wrap:balance}
h1 .em{position:relative;display:inline-block;padding:0 .12em}
h1 .em svg{position:absolute;left:-8%;top:-14%;width:116%;height:128%;overflow:visible}
h1 .em path{fill:none;stroke:var(--accent);stroke-width:3;stroke-linecap:round;stroke-dasharray:700;stroke-dashoffset:700;animation:draw 1.1s .3s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.lead{font-size:18px;line-height:1.6;color:var(--muted-fg);max-width:520px;margin:0 auto 28px;overflow-wrap:anywhere}
.form{display:flex;flex-direction:column;gap:12px;max-width:420px;margin:0 auto}
.err{min-height:22px;font-size:14px;color:var(--err-soft)}
.hint{font-size:14px;color:var(--muted-fg)}

/* OTP step (patterns from e-EXAM's login, kept in this theme) */
.otp-form{gap:14px;text-align:left}
.otp-delivery{display:grid;gap:4px;padding:13px 16px;border:1px solid var(--border);border-radius:14px;background:var(--muted)}
.otp-delivery span{font-size:13px;color:var(--muted-fg)}
.otp-delivery strong{font-size:16px;overflow-wrap:anywhere}
.fl{font-size:14px;font-weight:600;margin-bottom:-6px}
.otp-countdown{min-height:24px;margin:-6px 0 -2px;font-size:14px;color:var(--muted-fg);text-align:center;font-variant-numeric:tabular-nums}
.otp-countdown.expired{color:var(--err-soft)}
.note{min-height:22px;font-size:14px;text-align:center;margin:-4px 0}
.note .ok{color:var(--accent)} .note .bad{color:var(--err-soft)}
.otp-actions{display:flex;align-items:center;justify-content:space-between;gap:12px}
.otp-actions .linkbtn{text-decoration:none;color:var(--accent);font-weight:600}
.otp-actions .linkbtn:hover:not(:disabled){text-decoration:underline}
.otp-actions .linkbtn:disabled{color:var(--disabled-dark);cursor:not-allowed;font-weight:400}
.otp-help{padding:12px 14px;border:1px solid var(--border);border-radius:12px;background:var(--muted);color:var(--muted-fg);font-size:14px;line-height:1.7}
.otp-help strong{color:var(--foreground)}
.otp-security{font-size:13px;line-height:1.7;color:var(--muted-fg);text-align:center}

/* text that can land on the background illustration sits on a scrim so contrast holds at any screen height */
.proof span,.hint,.otp-security,.otp-countdown,.note:not(:empty),.otp-actions{background:var(--scrim);border-radius:12px;padding:4px 12px;width:fit-content;max-width:100%;margin-inline:auto}
.otp-actions{width:100%;padding:0 8px}
.proof span{display:inline-block}

/* controls: pills, flat, no shadows */
input,textarea{font:inherit;color:var(--card-fg);background:var(--card);border:1px solid var(--input);width:100%}
input{height:44px;border-radius:9999px;padding:12px 18px}
input.otp{height:62px;text-align:center;font-size:26px;letter-spacing:.45em;text-indent:.45em;font-weight:700;font-variant-numeric:tabular-nums}
input::placeholder,textarea::placeholder{color:var(--placeholder);opacity:1}
textarea{border-radius:16px;padding:12px 16px;min-height:110px;resize:vertical}
input,textarea{caret-color:var(--primary)}
input:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--primary);outline-offset:2px;box-shadow:0 0 0 2px var(--card)}
.pill{font:600 15px var(--font);height:44px;padding:0 28px;border-radius:9999px;border:0;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:background .15s}
.pill:disabled{opacity:.55;cursor:not-allowed}
.pill-primary{background:var(--primary);color:var(--foreground)}
.pill-primary:hover:not(:disabled){background:var(--primary-hover)}
.pill-primary:active:not(:disabled){background:var(--primary-active)}
.pill-light{background:var(--card);color:var(--card-fg)}
.pill-light:hover:not(:disabled){background:var(--soft)}
.pill-outline{background:var(--card);color:var(--card-fg);border:1px solid var(--line)}
.pill-outline:hover:not(:disabled){background:var(--soft)}
.pill-danger{background:var(--destructive);color:var(--foreground)}
.pill-danger:hover:not(:disabled){background:var(--destructive-hover)}
.pill.small{height:44px;padding:0 18px;font-size:14px}
.linkbtn{background:none;border:0;color:inherit;text-decoration:underline;text-underline-offset:3px;cursor:pointer;font:inherit;padding:10px 6px;min-height:44px}
.linkbtn:hover{text-decoration-thickness:2px}

/* cards */
.card{background:var(--card);color:var(--card-fg);border:1px solid var(--border);border-radius:16px;padding:24px;margin-top:16px}
.who-name{font-size:28px;font-weight:700;line-height:1.35;margin:0;overflow-wrap:anywhere}
.meta{color:var(--ink2);font-size:14px;margin-top:4px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin:24px 0}
.stat{background:var(--soft);border-radius:12px;padding:14px 16px}
.stat .k{font-size:13px;font-weight:600;color:var(--ink2)}
.stat .v{font-size:30px;font-weight:700;line-height:1.3;font-variant-numeric:tabular-nums}
.stat.total{background:var(--background);color:var(--foreground)}
.stat.total .k{color:var(--muted-fg)}
.q{font-weight:600;margin:0 0 12px}
.actions{display:flex;flex-wrap:wrap;gap:12px}
.report{margin-top:16px;display:flex;flex-direction:column;gap:12px}
.count{font-size:12px;color:var(--ink2);text-align:right}
.status{border-radius:12px;padding:16px;background:var(--soft)}
.status .t{font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.status .d{margin:8px 0 0;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--ink3)}
.status small{color:var(--ink2)}
.empty{color:var(--ink2);text-align:center;padding:24px}

/* badges / chips */
.badge{display:inline-flex;align-items:center;border-radius:9999px;padding:4px 10px;font-size:12px;font-weight:600;white-space:nowrap}
.b-confirmed{background:var(--accent);color:var(--accent-fg)}
.b-reported{background:var(--destructive);color:var(--foreground)}
.b-pending{background:var(--line);color:var(--ink3)}
.b-stale{background:var(--card);color:var(--ink2);border:1px solid var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:600 14px var(--font);border:1px solid var(--line);background:var(--card);color:var(--card-fg);border-radius:9999px;padding:0 16px;min-height:44px;cursor:pointer}
.chip:hover{background:var(--soft)}
.chip[aria-pressed=true]{background:var(--secondary);border-color:var(--secondary);color:var(--foreground)}
.chip[aria-pressed=true]:hover{background:var(--secondary)}

/* staff */
.banner{background:var(--destructive);color:var(--foreground);border-radius:16px;padding:14px 20px;font-weight:600;margin-top:16px;display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-top:16px}
.tile{background:var(--card);color:var(--card-fg);border-radius:16px;padding:16px 20px}
.tile .v{font-size:32px;font-weight:700;line-height:1.3;font-variant-numeric:tabular-nums}
.tile .k{font-size:13px;color:var(--ink2)}
.tools{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:12px}
.tools input{max-width:280px}
.row{display:grid;grid-template-columns:minmax(0,2.2fr) repeat(var(--rc),minmax(54px,.6fr)) minmax(60px,.7fr) minmax(130px,1fr);gap:12px;align-items:center;padding:12px 4px;border-top:1px solid var(--line)}
.row.head{border-top:0;font-size:13px;font-weight:600;color:var(--ink2)}
.row .num{text-align:right;font-variant-numeric:tabular-nums}
.row .h{display:none}
.row .nm b{display:block}
.row .nm span{font-size:13px;color:var(--ink2)}
.row .nm b{overflow-wrap:anywhere}
.detail{grid-column:1/-1;background:var(--soft);border-radius:12px;padding:12px 16px;font-size:14px}
.detail p{margin:0 0 10px;white-space:pre-wrap;overflow-wrap:anywhere}

.sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.dim{color:var(--ink2)} .tile .v .of{font-size:16px;color:var(--ink2)} .tile .v.neg{color:var(--destructive)}
.loading{color:var(--muted-fg)} .err-card{color:var(--destructive)}
.status{margin-bottom:16px}
.spin{width:18px;height:18px;border:2px solid currentColor;border-top-color:transparent;flex:none;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (max-width:720px){
  .who span{display:none} .pill{white-space:nowrap} .brand{font-size:14px}
  .nav{padding:12px 16px} main{padding:8px 16px 24px}
  .row{grid-template-columns:1fr auto;grid-auto-flow:row}
  .row.head{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
  .row .num{text-align:left}
  .row .h{display:inline}
  .stat.total{grid-column:1/-1}
  .actions .pill{flex:1 1 100%}
}
@media (prefers-reduced-motion:reduce){h1 .em path{animation:none;stroke-dashoffset:0}}
</style>
